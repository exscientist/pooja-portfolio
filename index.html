<!-- mobile nav + header offset -->
<style>
  /* the Squarespace header is position:absolute and out of flow, so any page
     whose first section starts at y=0 slides underneath it. Reserve its height. */
  body{--hdr-h:0px}
  .pg > section:first-of-type{padding-top:calc(96px + var(--hdr-h))}
  @media (max-width:600px){.pg > section:first-of-type{padding-top:calc(40px + var(--hdr-h))}}
  /* burger needs to sit above the overlay so it can close it again */
  .header-burger{pointer-events:auto;position:relative;z-index:3}
  .header--menu-open .header-menu{opacity:1;visibility:visible}
  .header--menu-open .header-menu .header-menu-nav-list{transform:translatey(0)}
  .header-menu-nav-item a{display:block;padding:14px 0}
  /* burger morphs into an X while open */
  .header--menu-open .burger-inner .top-bun{transform:translateY(5px) rotate(45deg)}
  .header--menu-open .burger-inner .bottom-bun{transform:translateY(-5px) rotate(-45deg)}
  .burger-inner .top-bun,.burger-inner .bottom-bun{transition:transform .2s ease}
  /* Navy on the overlay's yellow. The theme pairs that yellow with
     --menuOverlayNavigationLinkColor, but its --black-hsl token holds a white
     value, so the links, title and X all came out white-on-yellow (1.48:1).
     Navy is the inner pages' section colour and hits 11.5:1 here. */
  .header--menu-open{--menuOverlayNavigationLinkColor:rgb(17,8,97)}
  .header--menu-open .header .header-menu-nav-item a,
  .header--menu-open .header .header-title-text a,
  .header--menu-open .header .header-nav-wrapper a,
  .header--menu-open .header .header-nav-wrapper button{color:rgb(17,8,97)}
  /* the theme's last declaration for these is the ButtonText system colour,
     which ignores the variable above, so set the X bars explicitly */
  .header--menu-open .header .header-burger .top-bun,
  .header--menu-open .header .header-burger .patty,
  .header--menu-open .header .header-burger .bottom-bun{background-color:rgb(17,8,97)}
</style>
<script>
(function(){
  var body=document.body, header=document.getElementById('header');
  /* the header ships a desktop copy AND a mobile copy of the burger, so bind
     every one of them -- querySelector would only ever wire the desktop one */
  var btns=[].slice.call(document.querySelectorAll('.header-burger-btn'));
  var menus=[].slice.call(document.querySelectorAll('.header-menu'));

  /* publish the header's real height so content can clear it */
  function h(){ if(!header) return;
    var bar=header.querySelector('.header-announcement-bar-wrapper')||header;
    var v=Math.round(bar.getBoundingClientRect().height);
    body.style.setProperty('--hdr-h',v+'px');
    menus.forEach(function(m){m.style.paddingTop=v+'px'}); }
  h(); window.addEventListener('resize',h); window.addEventListener('load',h);

  if(!btns.length||!menus.length) return;
  function set(on){
    body.classList.toggle('header--menu-open',on);
    btns.forEach(function(b){
      b.setAttribute('aria-expanded',on?'true':'false');
      var o=b.querySelector('.js-header-burger-open-title'),
          c=b.querySelector('.js-header-burger-close-title');
      if(o) o.hidden=on; if(c) c.hidden=!on;
    });
  }
  btns.forEach(function(b){
    b.setAttribute('aria-expanded','false');
    b.addEventListener('click',function(e){ e.preventDefault(); set(!body.classList.contains('header--menu-open')); });
  });
  /* close on link tap or Escape */
  menus.forEach(function(m){ m.addEventListener('click',function(e){ if(e.target.closest('a')) set(false); }); });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape') set(false); });
})();
</script>
